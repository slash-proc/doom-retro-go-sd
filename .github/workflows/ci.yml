name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (keeps PR feedback fast).
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Makefile RELEASE_VERSION / firmware DOCKER_IMAGE.
  DOCKER_IMAGE: sylverb/retro-go-sd-builder:v1.5

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project_kind: ${{ steps.meta.outputs.project_kind }}
      packed_bin: ${{ steps.meta.outputs.packed_bin }}
      target_elf: ${{ steps.meta.outputs.target_elf }}
      target_map: ${{ steps.meta.outputs.target_map }}
      ro_bin: ${{ steps.meta.outputs.ro_bin }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags so `git describe --tags --dirty` works for CORE_VERSION.
          fetch-depth: 0

      - name: Read project metadata
        id: meta
        run: |
          set -euo pipefail
          PROJECT_KIND="$(make --no-print-directory -f Makefile print-PROJECT_KIND)"
          PACKED_BIN="$(make --no-print-directory -f Makefile print-PACKED_BIN)"
          TARGET_ELF="$(make --no-print-directory -f Makefile print-TARGET_ELF)"
          TARGET_MAP="$(make --no-print-directory -f Makefile print-TARGET_MAP)"
          RO_BIN="$(make --no-print-directory -f Makefile print-RO_BIN)"
          echo "project_kind=${PROJECT_KIND}" >> "${GITHUB_OUTPUT}"
          echo "packed_bin=${PACKED_BIN}" >> "${GITHUB_OUTPUT}"
          echo "target_elf=${TARGET_ELF}" >> "${GITHUB_OUTPUT}"
          echo "target_map=${TARGET_MAP}" >> "${GITHUB_OUTPUT}"
          echo "ro_bin=${RO_BIN}" >> "${GITHUB_OUTPUT}"
          echo "PROJECT_KIND=${PROJECT_KIND}"
          echo "PACKED_BIN=${PACKED_BIN}"
          echo "TARGET_ELF=${TARGET_ELF}"
          echo "TARGET_MAP=${TARGET_MAP}"

      - name: Build (Docker)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/opt/workdir" \
            -w /opt/workdir \
            "${{ env.DOCKER_IMAGE }}" \
            make --no-print-directory -j"$(nproc)" all

      # The shareware episode, converted with this project's own whd_gen so it
      # matches what the converter page produces today. Built in the same image
      # as the core because it uses the same host tool.
      - name: Build the shipped game
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/opt/workdir" \
            -w /opt/workdir \
            "${{ env.DOCKER_IMAGE }}" \
            make --no-print-directory shipped-games

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${{ steps.meta.outputs.packed_bin }}
            ${{ steps.meta.outputs.target_elf }}
            ${{ steps.meta.outputs.target_map }}
            ${{ steps.meta.outputs.ro_bin }}
            build/core/games/
          if-no-files-found: error

  # The WAD converter, built as a wasm module. Independent of the device build
  # -- it shares the engine sources but nothing else -- so it runs in parallel
  # and gates the release on its own terms.
  extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # check.sh builds the module, runs the conformance verifier over it -- the
      # same verifier a browser runs before instantiating, and a module that
      # fails it must never reach a release, because a manifest is a claim that
      # these bytes are safe to run -- and feeds it three malformed WADs to
      # prove each comes back as an error rather than a trap. Given a WAD it
      # also compares the output byte for byte against the native converter.
      # That last part cannot run here and neither can test-convert.mjs: both
      # need commercial WAD data, which this project cannot ship and CI cannot
      # obtain. They stay local checks, run before a release is cut:
      #
      #   ./check.sh /path/to/doom2.wad
      #   ./build-page.sh && node test-convert.mjs site /path/to/doom
      - name: Build and check the module
        run: tools/extractor/check.sh

      # The page is translated seven ways, so a renamed string is the easiest
      # thing to ship broken: the page still loads and the control is simply
      # blank for that language.
      - name: Page strings resolve in every locale
        working-directory: tools/extractor
        run: node test-i18n.mjs

      # install.mjs decides where every produced file lands, and for a core that
      # is two directories: the core binary in one, the games it converts in
      # another. Its own tests, because a name derived from the user's file is
      # the one part of the install set no publisher reviewed.
      - name: Install planning
        working-directory: tools/extractor
        run: node test-install.mjs

      # The page, assembled against a preview dist built from the module just
      # built, and walked the way app.js walks it. This is the last chance to
      # catch a page and a manifest that disagree before a tag exists.
      - name: The page loads what it is given
        working-directory: tools/extractor
        run: |
          set -euo pipefail
          ./build-page.sh
          node test-site.mjs site

      - name: Upload the module
        uses: actions/upload-artifact@v4
        with:
          name: extractor-wasm
          path: tools/extractor/doom_whd.wasm
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, extractor]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags so `git describe --tags --dirty` works for CORE_VERSION.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Download the module
        uses: actions/download-artifact@v4
        with:
          name: extractor-wasm
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail
          PACKED_BIN="${{ needs.build.outputs.packed_bin }}"
          TARGET_ELF="${{ needs.build.outputs.target_elf }}"
          TARGET_MAP="${{ needs.build.outputs.target_map }}"
          # Extra device files installed beside the packed binary. Read from
          # the Makefile so a project with two or ten of them needs no change
          # here, and staged out of dist/ where the build artifact landed --
          # stage_release.py resolves a bare name against the repo root.
          SIDECAR_ARGS=()
          for sidecar in $(make --no-print-directory print-SIDECARS); do
            SIDECAR_ARGS+=(--sidecar "dist/${sidecar}")
          done
          # Artifact download preserves relative paths under dist/.
          python3 scripts/stage_release.py \
            --bin "dist/${PACKED_BIN}" \
            "${SIDECAR_ARGS[@]}" \
            --elf "dist/${TARGET_ELF}" \
            --map "dist/${TARGET_MAP}" \
            --tag "${GITHUB_REF_NAME}" \
            --out release \
            --docker-image "${{ env.DOCKER_IMAGE }}"

      # The dist manifest a web installer reads. Attached to the release, which
      # is the source of truth; the Pages job mirrors it where a browser can
      # reach it. See https://github.com/slash-proc/gwrg-dist-spec
      # The ELF is published so a crash address can be resolved to a function.
      # It is named by the manifest but is not part of the install set, so it
      # has to be attached loose like any other file build_dist.py fetches.
      # The converter module. `binary.url` in the manifest is a plain filename
      # resolved beside it, so the module has to be attached to the release
      # like any other published file -- it is not in the repository, because
      # a built artifact that changes with every compile does not belong there.
      - name: Stage the module for publication
        run: |
          set -euo pipefail
          cp dist/doom_whd.wasm release/doom_whd.wasm
          echo doom_whd.wasm >> release/release-files.txt

      - name: Stage the ELF for publication
        run: |
          set -euo pipefail
          TARGET_ELF="${{ needs.build.outputs.target_elf }}"
          cp "dist/${TARGET_ELF}" "release/$(basename "${TARGET_ELF}")"
          echo "$(basename "${TARGET_ELF}")" >> release/release-files.txt

      - name: Generate the dist manifest
        run: |
          set -euo pipefail
          PACKED_BIN="${{ needs.build.outputs.packed_bin }}"
          TARGET_ELF="${{ needs.build.outputs.target_elf }}"
          # Every extra device file is an artifact in its own right, declared
          # with its own hash. Same list the staging step used.
          ARTIFACTS=()
          for sidecar in $(make --no-print-directory print-SIDECARS); do
            ARTIFACTS+=(--artifact "release/${sidecar}")
          done
          # Full-size box art, when this project keeps any. Optional and
          # tolerated when absent, so the same block works in every project.
          COVER_ARGS=()
          COVER_FULL="$(make --no-print-directory print-COVER_FULL 2>/dev/null || true)"
          if [ -n "${COVER_FULL}" ]; then
            COVER_ARGS+=(--cover "release/$(basename "${COVER_FULL}")")
          fi
          # Games published with the release. Copied under their installed
          # names -- which may contain spaces -- so make never sees them.
          GAME_ARGS=()
          GAMES_DIR="$(make --no-print-directory print-SHIPPED_GAMES)"
          if [ -d "dist/${GAMES_DIR}" ]; then
            while IFS= read -r -d '' game; do
              cp "${game}" "release/$(basename "${game}")"
              basename "${game}" >> release/release-files.txt
              GAME_ARGS+=(--game "release/$(basename "${game}")")
            done < <(find "dist/${GAMES_DIR}" -type f -print0)
          fi
          python3 scripts/make_manifest.py \
            --bin "release/${PACKED_BIN}" \
            "${ARTIFACTS[@]}" \
            "${GAME_ARGS[@]}" \
            --wasm release/doom_whd.wasm \
            --elf "release/$(basename "${TARGET_ELF}")" \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            "${COVER_ARGS[@]}" \
            --out release/manifest.json
          echo manifest.json >> release/release-files.txt

      # The offline bundle. Attached to the release, not built by the Pages job,
      # so what a user downloads offline is what the project actually published.
      - name: Build the offline bundle
        run: |
          set -euo pipefail
          BUNDLE="$(python3 scripts/make_bundle.py \
            --manifest release/manifest.json --dir release --print-name)"
          python3 scripts/make_bundle.py \
            --manifest release/manifest.json \
            --dir release \
            --out "release/${BUNDLE}"
          echo "${BUNDLE}" >> release/release-files.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -t names < release/release-files.txt

          # GitHub compares asset names case-insensitively, so two files that
          # differ only in case cannot both be attached. Catch that here rather
          # than as a 422 halfway through the upload loop.
          dupes="$(printf '%s\n' "${names[@]}" | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"
          if [ -n "${dupes}" ]; then
            echo "asset names collide case-insensitively: ${dupes}" >&2
            exit 1
          fi

          # Create the release empty, then upload assets one at a time. Doing
          # both in one gh call has failed with a 404 from uploads.github.com
          # partway through the asset list, leaving a release with only some of
          # its files and no way to retry the rest.
          # Deleting a tag does not delete its release -- GitHub turns the
          # release into a draft. A re-cut tag therefore finds a stale draft
          # here, and editing it would leave the release unpublished, which is
          # invisible to anything reading the releases list.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "deleting stale draft release ${TAG}"
              gh release delete "${TAG}" --yes
              gh release create "${TAG}" \
                --title "${TAG}" \
                --notes-file release/RELEASE_NOTES.md
            else
              echo "release ${TAG} already published; updating it"
              gh release edit "${TAG}" \
                --title "${TAG}" \
                --notes-file release/RELEASE_NOTES.md
            fi
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release/RELEASE_NOTES.md
          fi

          # Drop whatever is already attached. A rerun then cannot inherit a
          # stale asset from an earlier, differently-named build.
          existing="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          for asset in ${existing}; do
            echo "removing existing asset ${asset}"
            gh release delete-asset "${TAG}" "${asset}" --yes
          done

          for name in "${names[@]}"; do
            path="release/${name}"
            test -f "${path}" || { echo "missing asset: ${path}" >&2; exit 1; }
            for attempt in 1 2 3; do
              if gh release upload "${TAG}" "${path}" --clobber; then
                echo "uploaded ${name}"
                break
              fi
              if [ "${attempt}" = 3 ]; then
                echo "giving up on ${name} after 3 attempts" >&2
                exit 1
              fi
              echo "upload of ${name} failed; retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
            done
          done

          # Publish explicitly. A release that is still a draft is not in the
          # releases list, so the Pages job would not find the tag it just built.
          gh release edit "${TAG}" --draft=false --latest
          echo "release state: $(gh release view "${TAG}" --json isDraft,isPrerelease --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)"')"

          echo "assets now on the release:"
          gh release view "${TAG}" --json assets \
            --jq '.assets[] | "  \(.name) \(.size) bytes"' 

  # Rebuilds the whole dist/ tree from the releases every time, so the site is a
  # derived view rather than state edited in place. Runs after the release job so
  # a published site can never advertise a build that did not ship.
  pages:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the dist tree from the releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/build_dist.py \
            --repo "${GITHUB_REPOSITORY}" \
            --out _site/dist \
            --retain 5 \
            --require-tag "${GITHUB_REF_NAME}"

      # Pages must already be enabled on the repository (Settings -> Pages ->
      # Source: GitHub Actions). `enablement: true` cannot do it: creating a
      # Pages site needs repo-administration scope, which GITHUB_TOKEN lacks.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The conversion page, at the site root. The spec leaves the root free for
      # exactly this, and the page reads the manifest build_dist.py just
      # mirrored -- the same file, fetched the same way, as any third-party
      # installer. That is what makes this page a test of the distribution model
      # rather than a nicety beside it.
      - name: Build the conversion page
        run: |
          set -euo pipefail
          cd tools/extractor
          # DIST_DIR is the mirror that already exists, so the page ships the
          # real published versions instead of the preview dist build-page.sh
          # would otherwise generate. No MANIFEST_URL: setting it pins the page
          # to one version and hides the picker, so a release would need a
          # redeploy to be offered.
          DIST_DIR="${GITHUB_WORKSPACE}/_site/dist" \
            VERSIONS_URL="dist/versions.json" ./build-page.sh
          node test-site.mjs site
          cp -r site/. "${GITHUB_WORKSPACE}/_site/"

      - name: Show what will be published
        run: find _site -maxdepth 2 -printf "%P\n" | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
